server.port = 9999
spring.main.allow-bean-definition-overriding=true

spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/bluefit_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Manila
spring.datasource.username=root
spring.datasource.password=

## Hibernate Properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect
spring.jpa.hibernate.ddl-auto = update
spring.jpa.hibernate.connection.charSet = UTF-8
spring.jpa.hibernate.show_sql = true

## BlueFit
# number that receives the daily owner summary SMS
bluefit.owner.number = +639000000000
