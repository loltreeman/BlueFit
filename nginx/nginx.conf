http {
    server {
        listen 80;
        server_name bluefit.backend;
        location / {
            proxy_pass http://localhost:9999;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name twilio.fake;
        location / {
            proxy_pass http://localhost:9997;
            proxy_set_header Host $host;
        }
    }

    server {
        listen 80;
        server_name bluefit.ui;

        root ../ui;

        index index.html;

        location / {
            try_files $uri $uri/ =404;
        }
    }

}

events {}